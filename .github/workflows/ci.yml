name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect historical/source files and prevent deletions
        run: python scripts/safety_guard.py --compare '${{ github.event.pull_request.base.sha }}' '${{ github.event.pull_request.head.sha }}'

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel from source
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel
        shell: bash
        run: python -m pip install --no-deps dist/*.whl
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Full end-to-end smoke test
        run: python scripts/smoke_test.py
