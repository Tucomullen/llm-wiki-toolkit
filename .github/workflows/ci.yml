name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout pinned independent guard
        uses: actions/checkout@v4
        with:
          ref: 1b474c31c8aa6dff0d5d2a17fc0c8ce75a17a435
          path: _trusted_safety
          persist-credentials: false
      - name: Check pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python _trusted_safety/scripts/trusted_safety_policy.py --base "$BASE_SHA" --head "$HEAD_SHA"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test
        shell: bash
        run: |
          cp -r examples/demo-wiki "$RUNNER_TEMP/demo"
          cd "$RUNNER_TEMP/demo"
          wikikit split-index _meta/INDEX.md
          wikikit verify --fail-on-broken
      - name: First-user journey (installed CLI, fresh wiki, negative cases)
        shell: bash
        run: python scripts/first_user_smoke.py
